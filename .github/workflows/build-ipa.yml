name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  build-ipa:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build iOS IPA
      run: flutter build ipa --release
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ClawChat.ipa
        path: build/ios/ipa/ClawChat.ipa
        retention-days: 30
