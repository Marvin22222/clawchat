name: clawchat
description: "GlowChat - OpenClaw iOS App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  uuid: ^4.2.0
  intl: ^0.19.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.2
  # Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
